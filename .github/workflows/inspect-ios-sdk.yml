name: iOS SDK 검사 명령 확인
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-ios-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect installed simulator controls and runtimes
        run: |
          set -o pipefail
          mkdir -p artifacts/sdk-inspection
          sw_vers | tee artifacts/sdk-inspection/host.txt
          uname -m | tee -a artifacts/sdk-inspection/host.txt
          xcodebuild -version | tee artifacts/sdk-inspection/xcode.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/sdk-inspection/sdk.txt
          xcrun simctl help ui 2>&1 | tee artifacts/sdk-inspection/ui-help.txt
          xcrun simctl list runtimes --json | tee artifacts/sdk-inspection/runtimes.json
          xcrun simctl list devicetypes --json | tee artifacts/sdk-inspection/device-types.json
      - name: Read Settings availability metadata from installed runtimes
        run: node scripts/inspect-settings-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-inspection
          path: artifacts/sdk-inspection/**
          retention-days: 7

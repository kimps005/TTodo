name: 시뮬레이터 수동 입력·권한 UI 검사
run-name: 'UI 검사 · ${{ inputs.scenario || ''자동 회귀'' }} · ${{ inputs.text_size || ''large'' }}'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-tests.yml'
      - 'native/tests/UITests.swift'
      - 'native/ios/AnalyzeCaptureIntent.swift'
      - 'modules/ttodo-native/ios/TTodoNativeModule.swift'
      - 'scripts/ui-tests.mjs'
      - 'scripts/ui-simulator-selection.cjs'
      - 'scripts/ui-test-commands.cjs'
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'ARM 수용량 부족 시 무료 Intel 러너를 명시적으로 선택'
        type: choice
        default: macos-26
        options: [macos-26, macos-26-intel]
      scenario:
        description: '앱 조작, 공유·사진 OCR, 독립 삭제 또는 할 일 수명주기'
        type: choice
        default: task-lifecycle
        options: [app, share-extension, photo-ocr, data-reset, task-lifecycle]
      text_size:
        description: '기본 전체 흐름 또는 최대 접근성 글자 흐름'
        type: choice
        default: large
        options: [large, accessibility-extra-extra-extra-large]
      model:
        description: '설치된 SDK에서 확인할 iPhone 화면'
        type: choice
        default: iphone-16-pro
        options: [iphone-16-pro, iphone-se-3]
      runtime:
        description: '설치된 최신 또는 가장 이전 iOS (최소 지원 OS 보장 아님)'
        type: choice
        default: latest
        options: [latest, oldest-installed]
permissions:
  contents: read
concurrency:
  group: ui-tests-${{ github.ref }}-${{ inputs.scenario || 'automatic' }}-${{ inputs.macos_runner || 'macos-26' }}
  cancel-in-progress: true
jobs:
  ui:
    name: UI · ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'push' && '["primary", "compact", "oldest"]' || '["manual"]') }}
    runs-on: ${{ inputs.macos_runner || 'macos-26' }}
    timeout-minutes: ${{ inputs.macos_runner == 'macos-26-intel' && 75 || 45 }}
    env:
      CI: '1'
      TTODO_UI_TEXT_SIZE: ${{ matrix.profile == 'compact' && 'accessibility-extra-extra-extra-large' || inputs.text_size || 'large' }}
      TTODO_UI_SCENARIO: ${{ matrix.profile == 'compact' && 'app' || inputs.scenario || 'app' }}
      TTODO_UI_MODEL: ${{ matrix.profile == 'compact' && 'iphone-se-3' || inputs.model || 'iphone-16-pro' }}
      TTODO_UI_RUNTIME: ${{ matrix.profile == 'oldest' && 'oldest-installed' || inputs.runtime || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform ios --no-install
      - name: Configure isolated UI test target
        run: node scripts/configure-ui-tests.cjs
      - run: pod install
        working-directory: ios
      - name: Run real UI manual task flow
        run: |
          set -o pipefail
          node scripts/ui-tests.mjs 2>&1 | tee ui-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests-${{ matrix.profile }}
          path: |
            ui-test.log
            artifacts/ui-tests/**
          retention-days: 7

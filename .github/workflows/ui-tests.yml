name: 시뮬레이터 수동 입력 UI 검사
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform ios --no-install
      - name: Configure isolated UI test target
        run: node scripts/configure-ui-tests.cjs
      - run: pod install
        working-directory: ios
      - name: Run real UI manual task flow
        run: |
          set -o pipefail
          node scripts/ui-tests.mjs 2>&1 | tee ui-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests
          path: |
            ui-test.log
            artifacts/ui-tests/**
          retention-days: 7

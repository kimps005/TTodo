name: 품질 검사
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_only:
        description: 'JS 전용 변경 검사 (네이티브 빌드 성공으로 간주하지 않음)'
        type: boolean
        default: false
      macos_runner:
        description: '네이티브 컴파일 실행기 (ARM 용량 부족 시 Intel 선택)'
        type: choice
        default: macos-26
        options: [macos-26, macos-26-intel]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx expo export --platform ios
  ios:
    if: ${{ !inputs.core_only }}
    runs-on: ${{ inputs.macos_runner || 'macos-26' }}
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate iOS projects
        run: npx expo prebuild --platform ios --no-install
      - name: Test production Swift storage
        run: |
          swiftc modules/ttodo-native/ios/SharedStore.swift modules/ttodo-native/ios/TTodoConfiguration.swift native/tests/StoreSmoke.swift -o "$RUNNER_TEMP/ttodo-store-smoke"
          "$RUNNER_TEMP/ttodo-store-smoke"
      - name: Test native capture pipeline without model requests
        run: |
          swiftc modules/ttodo-native/ios/SharedStore.swift modules/ttodo-native/ios/TTodoConfiguration.swift modules/ttodo-native/ios/ExtractionValidator.swift modules/ttodo-native/ios/VisionOCR.swift modules/ttodo-native/ios/CaptureStore.swift modules/ttodo-native/ios/CaptureProcessor.swift native/tests/CaptureSmoke.swift -o "$RUNNER_TEMP/ttodo-capture-smoke"
          TTODO_CONTRACT_OUTPUT="$RUNNER_TEMP/ttodo-native-extraction.json" "$RUNNER_TEMP/ttodo-capture-smoke"
          npx tsx scripts/check-native-extraction.ts "$RUNNER_TEMP/ttodo-native-extraction.json"
      - name: Test actual Vision OCR with generated Korean image
        run: |
          swiftc modules/ttodo-native/ios/VisionOCR.swift native/tests/OCRSmoke.swift -framework AppKit -o "$RUNNER_TEMP/ttodo-ocr-smoke"
          TTODO_OCR_FIXTURE_OUTPUT="$GITHUB_WORKSPACE/artifacts/vision-ocr" "$RUNNER_TEMP/ttodo-ocr-smoke"
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Build iPhone simulator app and extension
        run: |
          set -o pipefail
          xcodebuild -workspace ios/TTodo.xcworkspace -scheme TTodo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: |
            xcodebuild.log
            artifacts/vision-ocr/**
          retention-days: 7
